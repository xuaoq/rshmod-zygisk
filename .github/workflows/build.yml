name: Build RshMod Zygisk Module

# 在 GitHub 免费 x86_64 runner 上编译 native .so + 打包完整模块。
# 触发：push 到 main，或手动 workflow_dispatch（推荐手动触发）
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'

      - name: Install NDK, platform, build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$ANDROID_SDK_ROOT/platforms/android-34/android.jar" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Build module + manager (all)
        env:
          NDK: ${{ env.NDK_HOME }}
          ANDROID_JAR: ${{ env.ANDROID_JAR }}
        run: |
          chmod +x build.sh
          ./build.sh all
          echo "=== artifacts ==="
          ls -la out/

      - name: Verify native .so present (4 ABI)
        run: |
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            test -f "out/module/zygisk/$abi/librshmod.so" && echo "OK $abi" || echo "MISSING $abi"
          done

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: RshMod-zygisk
          path: out/RshMod-zygisk-v1.8.5.zip
          retention-days: 1

      - name: Upload manager apk (if exists)
        uses: actions/upload-artifact@v4
        with:
          name: RshModManager
          path: out/RshModManager.apk
          if-no-files-found: ignore
          retention-days: 1